[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lawfirm-responder"
version = "0.2.0"
description = "律所企业微信客户群 AI 第一响应助手：判断引擎 + 合规护栏 + 人工提醒 + 律师控制台 API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "uvicorn>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "pycryptodome>=3.20,<4.0",
  "anthropic>=0.40",
  # 客资导入：平台导出多为 xlsx，让非技术同事少一步「另存为 CSV」
  "openpyxl>=3.1,<4.0",
  # 客户进线二维码：本地生成，链接不经过任何第三方生码服务
  "segno>=1.6,<2.0",
  # 下面两个原先是「靠别的包顺带装上」的，代码里直接 import 了却没声明。
  # 那种依赖在本地一点征兆都没有，只在干净环境里炸——而且是**启动那一刻**炸。
  # 由 tests/unit/test_dependencies_declared.py 守着，别再删。
  "starlette>=0.37,<1.0",       # console/api.py 直接用
  "python-dotenv>=1.0,<2.0",    # config.py 读 .env
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
responder-api = "responder.app:serve"

# **自动发现，不手写清单。**
# 手写过一版，代价是真实的：新增的 `responder.retail` 谁也没想起来往清单里加，
# 于是 `pip install .` 根本不装它，服务在干净环境里起不来
# （ModuleNotFoundError: No module named 'responder.retail'）。
# 而本地永远测不出来——本地是从源码目录跑的，Python 加载的是当前目录，
# 不是装好的那份。这跟仓库里反复出现的「封闭枚举必然漏」是同一件事。
[tool.setuptools.packages.find]
include = ["responder*"]

[tool.setuptools.package-data]
"responder.console" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
