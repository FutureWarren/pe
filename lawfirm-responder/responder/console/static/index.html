<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F2D4A'/%3E%3Ctext x='16' y='21' font-size='13' fill='%23fff' text-anchor='middle' font-family='serif'%3E%E6%9D%BE%3C/text%3E%3C/svg%3E">
<title>松沪律所 · AI 响应助手控制台</title>
<style>
/* ================= 设计令牌（规范 v2.0 §1） ================= */
:root {
  color-scheme: light;
  --bg: #F7F5F0; --card: #FFFFFF; --card-2: #F2EFE9;
  --line: #E7E2D8; --line-strong: #D9D2C3;
  --ink-1: #1C2B3A; --ink-2: #4C5A68; --ink-3: #6E7883;
  --brand: #1E4E79; --brand-deep: #0F2D4A; --brand-tint: #EAF1F8;
  --brand-btn: #1E4E79; --brand-btn-ink: #FFFFFF;
  --accent: #8A6D1E; --accent-line: #C2A65C;
  --ok: #1E7A46; --ok-bg: #E9F4EC;
  --warn: #9E6A00; --warn-bg: #FAF1DE;
  --bad: #C23B36; --bad-bg: #FBECEA;
  --chip-bg: #F2EFE9; --scrim: rgba(15,29,42,.45);
  --s1: #2A78D6; --s2: #EB6834; --s3: #1BAF7A; /* 仅看板分布图 */
  --r-1: 6px; --r-2: 10px; --r-3: 14px; --r-4: 20px; --r-full: 999px;
  --shadow-1: 0 1px 2px rgba(16,32,54,.05);
  --shadow-2: 0 2px 8px rgba(16,32,54,.08);
  --shadow-3: 0 12px 32px rgba(15,45,74,.18);
  --topbar-ink: #FFFFFF; --topbar-bg: #0F2D4A;
  --topbar-line: rgba(194,166,92,.6);
  --capsule-bg: rgba(255,255,255,.12); --capsule-ink: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #12171E; --card: #1A2129; --card-2: #212A34;
    --line: #2C3642; --line-strong: #3A4654;
    --ink-1: #EDF0F4; --ink-2: #A7B1BC; --ink-3: #8B96A4;
    --brand: #8FB3DE; --brand-deep: #1A2129; --brand-tint: #223245;
    --brand-btn: #33628F; --brand-btn-ink: #F2F7FC;
    --accent: #C9AC63; --accent-line: #C9AC63;
    --ok: #57BE84; --ok-bg: #1C3226;
    --warn: #DFA84E; --warn-bg: #362E1B;
    --bad: #E5726C; --bad-bg: #3A2422;
    --chip-bg: #232D38; --scrim: rgba(0,0,0,.55);
    --s1: #3987E5; --s2: #D95926; --s3: #199E70;
    --shadow-1: none; --shadow-2: 0 0 #0000;
    --shadow-3: 0 8px 24px rgba(0,0,0,.4);
    --topbar-ink: var(--ink-1); --topbar-bg: var(--card);
    --topbar-line: var(--line);
    --capsule-bg: #232D38; --capsule-ink: var(--ink-1);
  }
}
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: system-ui, -apple-system, "PingFang SC", "HarmonyOS Sans SC", "MiSans",
    "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  background: var(--bg); color: var(--ink-1);
  font-size: 15px; line-height: 1.6;
  font-variant-numeric: tabular-nums;
  padding-bottom: calc(60px + env(safe-area-inset-bottom));
}
button { font: inherit; cursor: pointer; color: inherit; background: none; border: 0; padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--brand); outline-offset: 2px;
}
.serif {
  font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC",
    "SimSun", Georgia, serif;
  font-weight: 500; letter-spacing: .08em;
}
svg.ico {
  width: 16px; height: 16px; flex: none; vertical-align: -3px;
  fill: none; stroke: currentColor; stroke-width: 1.75;
  stroke-linecap: round; stroke-linejoin: round;
}

/* ================= 印章徽标 ================= */
.seal {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--brand-deep); color: #fff; border-radius: 8px; flex: none;
}
@media (prefers-color-scheme: dark) { .seal { background: var(--brand-btn); } }
.seal.lg { width: 48px; height: 48px; font-size: 18px; }
.seal.sm { width: 24px; height: 24px; font-size: 11px; border-radius: 6px; }
.seal.md { width: 32px; height: 32px; font-size: 13px; }

/* ================= 按钮四级 ================= */
.btn-primary {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--brand-btn); color: var(--brand-btn-ink);
  border-radius: var(--r-2); height: 44px; padding: 0 20px;
  font-size: 15px; font-weight: 600;
}
.btn-primary.xl { height: 48px; width: 100%; }
.btn-tonal {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--brand-tint); color: var(--brand);
  border-radius: var(--r-2); height: 36px; padding: 0 14px;
  font-size: 13px; font-weight: 600;
}
.btn-outline {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--card); border: 1px solid var(--line-strong); color: var(--ink-1);
  border-radius: var(--r-2); height: 40px; padding: 0 16px; font-size: 14px;
}
.btn-text {
  display: inline-flex; align-items: center; gap: 4px;
  color: var(--brand); font-size: 13px; font-weight: 600;
  min-height: 44px; padding: 0 8px;
}
.btn-text.muted { color: var(--ink-2); }
button:active { opacity: .8; }
button:disabled { opacity: .4; cursor: default; }

/* ================= Chip / Badge ================= */
.chip, .badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; padding: 2px 8px; border-radius: var(--r-1); white-space: nowrap;
  max-width: 46vw; overflow: hidden; text-overflow: ellipsis;
}
.chip { background: var(--chip-bg); color: var(--ink-2); }
.chip .tx, .badge .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.badge, button.time { position: relative; }
button.badge::after, button.time::after { content: ""; position: absolute; inset: -8px; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.bad { background: var(--bad-bg); color: var(--bad); font-weight: 600; }
.badge.brand { background: var(--brand-tint); color: var(--brand); }
.badge svg.ico { width: 14px; height: 14px; }
.dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }

/* ================= 布局骨架 ================= */
header#topbar {
  position: sticky; top: 0; z-index: 6;
  background: var(--topbar-bg); color: var(--topbar-ink);
  border-bottom: 1px solid var(--topbar-line);
  height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px;
}
header#topbar .word { font-size: 16px; }
header#topbar .app { font-size: 13px; opacity: .75; display: flex; align-items: center; gap: 8px; }
header#topbar .app::before { content: ""; width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .6; }
.capsule {
  margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
  background: var(--capsule-bg); color: var(--capsule-ink);
  border-radius: var(--r-full); padding: 5px 12px; font-size: 12px;
}
.capsule .dot.pulse { animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

#banner {
  background: var(--warn-bg); color: var(--warn); font-size: 13px;
  padding: 10px 16px; display: none;
}
#banner.show { display: block; }

main { max-width: 720px; margin: 0 auto; padding: 12px 16px 32px; }
.page-title { display: none; }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-3);
  padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow-1);
}
.card.urgent { position: relative; overflow: hidden; }
.card.urgent::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--bad);
}
.row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.time {
  font-size: 12px; color: var(--ink-3); margin-left: auto; white-space: nowrap;
  min-height: auto; padding: 4px 0 4px 8px;
}
.body-l { font-size: 16px; line-height: 1.7; margin: 8px 0 6px; white-space: pre-wrap; word-break: break-word; }
.meta { font-size: 12px; color: var(--ink-3); }
.eyebrow {
  font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: .05em;
  margin: 20px 0 8px;
}
.eyebrow:first-child { margin-top: 4px; }
.overview { font-size: 15px; color: var(--ink-2); margin: 4px 0 12px; }

.empty { text-align: center; padding: 48px 24px; color: var(--ink-3); }
.empty svg { width: 40px; height: 40px; color: var(--ink-3); stroke-width: 1.5; }
.empty .t1 { font-size: 15px; color: var(--ink-2); margin-top: 12px; }
.empty .t2 { font-size: 13px; margin-top: 6px; line-height: 1.6; }

.skel .bar { background: var(--card-2); border-radius: 6px; height: 14px; margin: 8px 0; }
.err-card { text-align: center; padding: 40px 24px; }
.err-card svg { width: 40px; height: 40px; color: var(--ink-3); stroke-width: 1.5; }
.err-card p { margin: 12px 0 16px; color: var(--ink-2); font-size: 15px; }

/* ================= 底部导航 / 桌面侧栏 ================= */
nav#nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 8;
  display: flex; background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
nav#nav .brand, nav#nav .nav-foot { display: none; }
nav#nav .navbtn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 0 6px; font-size: 12px; color: var(--ink-3); position: relative;
}
nav#nav .navbtn svg { width: 22px; height: 22px; }
nav#nav .navbtn.on { color: var(--brand); font-weight: 600; }
nav#nav .navbtn .nbadge {
  position: absolute; top: 4px; left: 50%; margin-left: 10px;
  background: var(--bad); color: #fff; font-size: 10px; font-weight: 600;
  border-radius: var(--r-full); min-width: 16px; height: 16px; line-height: 16px;
  padding: 0 4px; text-align: center; box-shadow: 0 0 0 1.5px var(--card);
}
@media (prefers-color-scheme: dark) { nav#nav .navbtn .nbadge { color: #12171E; } }

/* ================= 看板 ================= */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-3); padding: 14px 16px; }
.tile .n { font-size: 28px; font-weight: 700; line-height: 1.1; }
.tile .l { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.tile .duo { display: flex; gap: 16px; }
.tile .duo .n { font-size: 20px; }
.tile .duo .l { font-size: 11px; }
.dist { display: flex; height: 24px; border-radius: var(--r-1); overflow: hidden; gap: 2px; margin: 10px 0 10px; }
.dist div { min-width: 4px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }

/* ================= Segmented ================= */
.seg {
  display: flex; background: var(--chip-bg); border-radius: var(--r-2); padding: 3px;
  margin-bottom: 12px;
}
.seg button {
  flex: 1; height: 36px; border-radius: 8px; font-size: 14px; color: var(--ink-2);
}
.seg button.on { background: var(--card); color: var(--brand); font-weight: 600; box-shadow: var(--shadow-1); }

/* ================= 回复卡 ================= */
.quote {
  border-left: 2px solid var(--brand-tint); padding-left: 10px;
  font-size: 16px; line-height: 1.7; margin: 8px 0 6px;
  white-space: pre-wrap; word-break: break-word;
}
@media (prefers-color-scheme: dark) { .quote { border-left-color: var(--brand-tint); } }
.quote.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.fb-row { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 6px; }
.fb-note { font-size: 12px; color: var(--ink-3); margin-top: 4px; }

/* ================= 表单 ================= */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
.field label .req { color: var(--bad); }
.field input, .field select, .field textarea {
  font: inherit; font-size: 16px; width: 100%; height: 44px; padding: 0 14px;
  border-radius: var(--r-2); border: 1px solid var(--line); background: var(--bg); color: var(--ink-1);
}
.field textarea { height: auto; min-height: 84px; padding: 10px 14px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--brand); border-width: 1.5px; outline: none;
}
.field .help { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.field.error input { border-color: var(--bad); }
.field.error .help { color: var(--bad); }
.field input[readonly] { background: var(--chip-bg); color: var(--ink-2); }
#sheet .field input, #sheet .field select { height: 48px; }
.btn-danger { color: var(--bad); }

/* ================= 开关 ================= */
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: var(--r-full); background: var(--line-strong); transition: .15s; pointer-events: none; }
.switch span::after {
  content: ""; position: absolute; width: 24px; height: 24px; border-radius: 50%;
  background: #fff; top: 2px; left: 2px; transition: .15s; box-shadow: var(--shadow-2), 0 1px 3px rgba(0,0,0,.2);
}
.switch input:checked + span { background: var(--ok); }
.switch input:checked + span::after { left: 20px; }
.switch input:focus-visible + span { outline: 2px solid var(--brand); outline-offset: 2px; }

/* ================= Sheet / Modal ================= */
#sheetWrap { position: fixed; inset: 0; z-index: 30; display: none; }
#sheetWrap.show { display: block; }
#sheetWrap .scrim { position: absolute; inset: 0; background: var(--scrim); }
#sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow-y: auto;
  background: var(--card); border-radius: var(--r-4) var(--r-4) 0 0; box-shadow: var(--shadow-3);
  padding: 8px 20px calc(20px + env(safe-area-inset-bottom));
  animation: up .2s ease-out;
}
@media (prefers-color-scheme: dark) { #sheet { background: var(--card-2); } }
@keyframes up { from { transform: translateY(24px); opacity: .6; } }
#sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--ink-3); opacity: .3; margin: 4px auto 12px; }
#sheet h2 { font-size: 17px; font-weight: 600; line-height: 1.3; margin-bottom: 4px; padding-right: 44px; }
#sheet .close { position: absolute; top: 10px; right: 8px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--ink-2); }
#sheet .sub { font-size: 12px; color: var(--ink-3); margin-bottom: 12px; }

.fb-opts { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.fb-opts button {
  height: 40px; padding: 0 14px; border-radius: var(--r-2);
  border: 1px solid var(--line-strong); background: var(--card); font-size: 14px; color: var(--ink-1);
}
@media (prefers-color-scheme: dark) { .fb-opts button { background: var(--card-2); } }
.fb-opts button.on { border-color: var(--brand); color: var(--brand); background: var(--brand-tint); font-weight: 600; }

.status-rows { margin: 8px 0 4px; }
.status-rows .srow { padding: 10px 0; border-bottom: 1px solid var(--line); }
.status-rows .srow:last-child { border-bottom: 0; }
.status-rows .k { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.status-rows .v { font-size: 13px; color: var(--ink-2); margin-top: 2px; line-height: 1.6; }
.gold-tag { display: inline-block; width: 3px; height: 14px; background: var(--accent-line); border-radius: 1px; margin-right: 8px; vertical-align: -2px; }

/* ================= Toast ================= */
#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 40;
  max-width: 92%; display: none; align-items: center; gap: 10px;
  background: #1C2B3A; color: #fff; border-radius: var(--r-2);
  padding: 10px 16px; font-size: 14px; box-shadow: var(--shadow-3);
}
@media (prefers-color-scheme: dark) { #toast { background: var(--card-2); color: var(--ink-1); border: 1px solid var(--line-strong); } }
#toast.show { display: flex; }
#toast .undo { color: var(--accent-line); font-weight: 600; padding: 4px 8px; margin: -4px -8px -4px 0; }

/* ================= 登录 ================= */
#login {
  position: fixed; inset: 0; z-index: 50; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
}
#login[hidden] { display: none; }
/* 组件类里的 display（如 .btn-outline 的 inline-flex）会盖掉浏览器对 hidden 的
   默认 display:none，导致「加载更多/自动分派」这类按钮藏不住。全局兜住。 */
[hidden] { display: none !important; }
#login .box { width: min(360px, 100%); text-align: center; }
#login .goldline { width: 24px; height: 2px; background: var(--accent-line); margin: 0 auto 16px; }
#login .firm { font-size: 22px; letter-spacing: .12em; color: var(--ink-1); margin-top: 16px; }
#login .app { font-size: 13px; color: var(--ink-3); margin-top: 6px; }
#login form { margin-top: 40px; text-align: left; }
#login .tokwrap { position: relative; }
#login .tokwrap svg.lock { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
#login .tokwrap input { padding-left: 42px; padding-right: 48px; }
#login .eye { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--ink-3); }
#login .errline { color: var(--bad); font-size: 13px; min-height: 1.4em; margin: 8px 0 12px; }
#login .foot { position: absolute; bottom: calc(20px + env(safe-area-inset-bottom)); font-size: 12px; color: var(--ink-3); }

/* ================= 桌面端 ================= */
@media (min-width: 900px) {
  body { padding-bottom: 32px; padding-left: 232px; }
  header#topbar, .capsule.mobile { display: none; }
  nav#nav {
    top: 0; bottom: 0; right: auto; width: 232px; flex-direction: column;
    border-top: 0; border-right: 1px solid var(--line); padding: 24px 12px 16px;
  }
  nav#nav .brand { display: block; padding: 0 12px 20px; }
  nav#nav .brand .word { font-size: 16px; color: var(--ink-1); display: block; margin-top: 10px; }
  nav#nav .brand .app { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  nav#nav .brand .goldline { width: 24px; height: 1px; background: var(--accent-line); margin-top: 12px; }
  nav#nav .navbtn {
    flex: none; flex-direction: row; gap: 10px; justify-content: flex-start;
    height: 44px; padding: 0 12px; border-radius: var(--r-2); font-size: 14px; color: var(--ink-2);
  }
  nav#nav .navbtn svg { width: 20px; height: 20px; }
  nav#nav .navbtn.on { background: var(--brand-tint); color: var(--brand); }
  nav#nav .navbtn .nbadge { position: static; margin-left: auto; box-shadow: none; }
  .tile .n { font-size: 32px; }
  #toast .undo { color: #8FB3DE; }
  nav#nav .nav-foot { display: block; margin-top: auto; padding: 0 12px; }
  nav#nav .nav-foot .capsule { margin: 0 0 10px; background: var(--chip-bg); color: var(--ink-1); cursor: pointer; }
  main { padding: 28px 32px 48px; max-width: 780px; }
  .page-title {
    display: block; font-size: 17px; font-weight: 600; margin-bottom: 16px;
    padding-top: 12px; border-top: 2px solid var(--accent-line);
  }
  #sheet {
    left: 50%; right: auto; bottom: auto; top: 50%; transform: translate(-50%, -50%);
    width: 480px; border-radius: 16px; animation: none; max-height: 86vh;
  }
  #sheet.wide { width: 560px; }
  #sheet .grab { display: none; }
  #toast { bottom: 32px; }
  .card:hover { border-color: var(--line-strong); box-shadow: var(--shadow-2); }
}
@media (min-width: 1200px) {
  main { max-width: 1024px; }
  .tiles { grid-template-columns: repeat(5, 1fr); }
  .board-split { display: grid; grid-template-columns: 7fr 5fr; gap: 10px; align-items: start; }
  .board-split .tiles { grid-template-columns: 1fr 1fr; }
  #groupList { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #groupList .card { margin-bottom: 0; }
  #teamList { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #teamList .card { margin-bottom: 0; }
}
/* 角色门控：律师身份不渲染管理入口（服务端仍强制鉴权，这里只是少画） */
body:not([data-role=admin]) .admin-only { display: none !important; }
/* 检索条：几百条线索/群档案时的生存工具 */
.filterbar { margin-bottom: 8px; }
.searchwrap { display: flex; align-items: center; gap: 8px; padding: 0 12px;
  background: var(--card, #fff); border: 1px solid var(--line); border-radius: 10px; }
.searchwrap .ico { width: 17px; height: 17px; color: var(--ink-2); flex: none; }
.searchwrap input { flex: 1; border: 0; outline: 0; background: transparent;
  min-height: 44px; font-size: 16px; color: var(--ink-1); }
.chiprow { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto;
  -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.chiprow::-webkit-scrollbar { display: none; }
.fchip { position: relative; flex: none; padding: 6px 12px; border-radius: 999px;
  font-size: 13px; border: 1px solid var(--line); background: var(--card, #fff);
  color: var(--ink-2); min-height: 34px; }
/* 视觉尺寸保持紧凑，热区补足到易点范围（横向滚动条上的小胶囊尤其难点） */
.fchip::after { content: ""; position: absolute; inset: -6px; }
.fchip.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
@media (prefers-color-scheme: dark) {
  /* 深色下 --brand 是浅蓝，白字压上去只有约 2.2:1，选中态基本读不出来 */
  .fchip.on { background: var(--brand-btn); border-color: var(--brand-btn); color: var(--brand-btn-ink); }
}
:root[data-theme=dark] .fchip.on {
  background: var(--brand-btn); border-color: var(--brand-btn); color: var(--brand-btn-ink);
}
/* 优先级标识：P0 必须一眼跳出来 */
.pchip { display:inline-flex; align-items:center; gap:4px; padding:2px 9px;
  border-radius:999px; font-size:12px; font-weight:700; letter-spacing:.02em; }
.pchip.p0 { background: var(--bad-bg, #FBEAEA); color: var(--bad); }
.pchip.p1 { background: var(--warn-bg); color: var(--warn); }
.pchip.p2 { background: var(--chip-bg); color: var(--ink-2); }
</style>
</head>

<script>
"use strict";
/* ============ 术语映射（P0-1：未知枚举一律「—」） ============ */
const ZH = {
  action: { answer: "直接回答", handoff: "安抚承接", silence: "保持沉默" },
  category: { general_law: "通用法律", case_status: "案件进展", fee: "费用咨询",
              urgent: "紧急", contact: "找人/催复", chitchat: "闲聊",
              greeting: "开场引导", other: "其他" },
  status: { signed: "已成交", prospect: "咨询中" },
  todo: { pending: "待跟进", sent: "已提醒", escalated: "已提醒第二责任人", done: "已处理" },
};
const zh = (map, key) => (map && map[key]) || "—";
const ico = (name, cls) => `<svg class="ico ${cls || ""}"><use href="#i-${name}"/></svg>`;

/* localStorage 在部分 WebView/隐私模式下会抛异常：全部经安全封装，失败退内存 */
const _mem = {};
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return _mem[k] ?? null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} _mem[k] = v; }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} delete _mem[k]; }

let token = lsGet("admin_token") || "";
/* 律师登录链接把令牌放在 # 片段（不进服务器日志）：进页即收取并抹掉地址栏痕迹 */
if (location.hash.startsWith("#t=")) {
  token = decodeURIComponent(location.hash.slice(3));
  lsSet("admin_token", token);
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
}
let me = null; // /console/me 的结果：{role, userid, name}
let tab = "todo", logView = "replies", groupsCache = [], loadedOnce = {};
let lastSuccess = null, offline = false, logReq = 0;
const expanded = new Set(), lastSig = {}, repliesFb = {};

/* ============ 基础设施 ============ */
async function api(path, opts = {}) {
  opts.headers = Object.assign({ "X-Admin-Token": token }, opts.headers || {});
  let r;
  try {
    r = await fetch("/console" + path, opts);
  } catch (e) { setOffline(true); throw e; }
  if (r.status === 401) {
    showLogin("登录已过期或令牌已更换，请重新输入访问令牌");
    throw new Error("401");
  }
  if (!r.ok) {
    /* 带上服务端 detail：否则「推送失败」永远提示「检查接待人」，
       而真实原因可能是影子模式、文件缺列、越权等完全不同的事 */
    let detail = "";
    try { detail = (await r.json()).detail || ""; } catch (e) {}
    const err = new Error("HTTP " + r.status);
    err.detail = detail;
    err.status = r.status;
    throw err;
  }
  setOffline(false);
  lastSuccess = new Date();
  return r.json();
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtLast(t) {
  /* 跨天后只显示 22:10 会让人分不清是今天还是昨天 */
  const now = new Date();
  const sameDay = t.getFullYear() === now.getFullYear()
    && t.getMonth() === now.getMonth() && t.getDate() === now.getDate();
  return (sameDay ? "" : dayLabel(t.toISOString()) + " ") + fmtHM(t);
}
function fmtHM(t) {
  return String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0");
}
function fmtFull(iso) {
  const t = new Date(iso);
  return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")} ${fmtHM(t)}`;
}
function ago(iso) {
  if (!iso) return "";
  const t = new Date(iso), s = (Date.now() - t.getTime()) / 1000;
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  if (s < 86400) return Math.floor(s / 3600) + " 小时前";
  return `${t.getMonth() + 1}月${t.getDate()}日 ${fmtHM(t)}`;
}
/* P2-10 相对时间点击切换完整时间 */
function timeEl(iso) {
  return `<button class="time" data-iso="${esc(iso || "")}" onclick="flipTime(this)">${ago(iso)}</button>`;
}
function flipTime(el) {
  const iso = el.dataset.iso;
  if (!iso) return;
  el.textContent = el.dataset.flipped ? ago(iso) : fmtFull(iso);
  el.dataset.flipped = el.dataset.flipped ? "" : "1";
}
function dayLabel(iso) {
  const t = new Date(iso), now = new Date();
  const d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const d = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const diff = Math.round((d0 - d) / 86400000);
  if (diff === 0) return "今天";
  if (diff === 1) return "昨天";
  return `${t.getMonth() + 1}月${t.getDate()}日`;
}
function groupName(gid) {
  const g = groupsCache.find(x => x.group_id === gid);
  if (g && g.name) return g.name;
  return gid.length > 12 ? gid.slice(0, 12) + "…" : gid;
}
function skeleton() {
  return Array(3).fill(0).map(() => `
    <div class="card skel" aria-hidden="true">
      <div class="bar" style="width:40%"></div>
      <div class="bar" style="width:90%"></div>

let toastTimer = null, undoFn = null;
function toast(msg, ok = true, undo = null) {
  const el = document.getElementById("toast");
  clearTimeout(toastTimer); undoFn = undo;
  el.innerHTML = ico(ok ? "check" : "alert") + `<span>${esc(msg)}</span>` +
    (undo ? `<button class="undo" onclick="runUndo()">撤销</button>` : "");
  el.classList.add("show");
  toastTimer = setTimeout(() => el.classList.remove("show"), undo ? 8000 : 2500);
}
async function runUndo() {
  document.getElementById("toast").classList.remove("show");

/* ============ Sheet：焦点圈禁 + 还焦 + 脏表单保护 ============ */
let sheetDirty = false, sheetReturnFocus = null;
function sheetOpen() { return document.getElementById("sheetWrap").classList.contains("show"); }
function _setInert(on) {
  for (const id of ["topbar", "nav", "banner"]) {
    const el = document.getElementById(id);
    if (el) try { el.inert = on; } catch (e) {}
  }
  const m = document.querySelector("main");
  if (m) try { m.inert = on; } catch (e) {}
}
function openSheet(html, wide = false) {
  sheetDirty = false;
  sheetReturnFocus = document.activeElement;
  const body = document.getElementById("sheetBody");
  body.innerHTML = html;
  const h2 = body.querySelector("h2");
  if (h2) h2.id = "sheetTitle";
  document.getElementById("sheet").classList.toggle("wide", wide);
  document.getElementById("sheetWrap").classList.add("show");
  document.body.style.overflow = "hidden";
  _setInert(true);
  document.getElementById("sheet").focus();
}
/* 有未保存输入时，误触遮罩/Esc 先确认再关（P0 级防丢单） */
function closeSheet() {
  if (sheetDirty && !document.getElementById("discardBar")) {
    const bar = document.createElement("div");
    bar.id = "discardBar";
    bar.style.cssText = "display:flex;align-items:center;gap:10px;margin-top:14px;" +
      "padding:12px 14px;background:var(--warn-bg);border-radius:10px";
    bar.innerHTML = `<span style="font-size:14px;color:var(--warn)">放弃已填写的内容？</span>
      <button class="btn-text muted" style="margin-left:auto;min-height:36px"
        onclick="this.parentNode.remove()">继续填写</button>
      <button class="btn-text" style="min-height:36px;color:var(--bad)"
        onclick="forceCloseSheet()">放弃</button>`;
    document.getElementById("sheetBody").appendChild(bar);
    bar.scrollIntoView({ block: "nearest" });
    return;
  }
  forceCloseSheet();
}
function forceCloseSheet() {
  sheetDirty = false;
  document.getElementById("sheetWrap").classList.remove("show");
  document.body.style.overflow = "";
  _setInert(false);
  if (sheetReturnFocus && sheetReturnFocus.isConnected) {
    try { sheetReturnFocus.focus(); } catch (e) {}
  }
  sheetReturnFocus = null;
}
document.getElementById("sheetBody").addEventListener("input", () => { sheetDirty = true; });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && sheetOpen()) { closeSheet(); return; }
  if (e.key === "Tab" && sheetOpen()) {
    const els = document.getElementById("sheet").querySelectorAll(
      "button, input, select, textarea, [tabindex]:not([tabindex='-1'])");
    const list = Array.from(els).filter(el => !el.disabled && el.offsetParent !== null);
    if (!list.length) return;
    const first = list[0], last = list[list.length - 1];
    if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
  }
});

async function loadTodo() {
  const el = document.getElementById("todoList");
  if (!loadedOnce.todo) el.innerHTML = skeleton();
  let list;
  try { list = await api("/todo"); }
  catch (e) { if (String(e.message) !== "401") el.innerHTML = errCard("loadTodo"); return; }
  loadedOnce.todo = true;
  list = list.filter(r => r.status !== "done");
  paintTodoBadge(list.length);
  /* 数据未变不重渲染：轮询静默、不打断阅读与操作（P1-9） */
  const sig = JSON.stringify(list);
  if (lastSig.todo === sig) return;
  lastSig.todo = sig;
  if (!list.length) {
    el.innerHTML = emptyState("clipboard", "暂无待跟进事项",
      "客户消息一切正常，AI 正在值守。需要人工跟进的事项会出现在这里，并在下方角标提醒您。");
    return;
  }
  const urgent = list.filter(r => r.urgent), normal = list.filter(r => !r.urgent);
  /* 客户问的什么＝主角。摘要里那句「客户群 X 有待跟进消息」在这里是冗余的
     （群名已是 chip、紧急已是 badge），把它挤掉正文会让律师扫不到重点。 */
  const cardHtml = r => {
    const q = r.question || (r.summary || "").split("\n").find(l => l.startsWith("客户问题："))?.slice(5) || r.summary;
    const ai = r.ai_reply || (r.summary || "").split("\n").find(l => l.startsWith("AI 已回复："))?.slice(7) || "";
    const tip = (r.summary || "").split("\n").find(l => l.startsWith("建议回复要点："))?.slice(7) || "";
    return `
    <div class="card ${r.urgent ? "urgent" : ""}" id="todo-${r.id}">
      <div class="row">
        ${r.urgent ? `<span class="badge bad"><span class="dot" style="background:var(--bad)"></span>紧急</span>` : ""}
        <span class="chip"><span class="tx">${esc(groupName(r.group_id))}</span></span>
        ${r.escalated_at ? `<span class="badge warn">已提醒第二责任人</span>` : ""}
        ${timeEl(r.created_at)}
      </div>
      <div class="body-l">${esc(q)}</div>
      ${ai ? `<div class="meta" style="border-left:2px solid var(--line);padding-left:10px;margin-top:6px">AI 已回复：${esc(ai)}</div>` : ""}
      ${tip ? `<div class="meta" style="margin-top:6px">${esc(tip)}</div>` : ""}
      <div class="row fb-row">
        <button class="btn-text muted" data-act="convo" data-gid="${esc(r.group_id)}">${ico("message")}查看对话</button>
        <button class="btn-tonal" style="margin-left:auto" onclick="doneTodo(${r.id})">${ico("check")}标记已处理</button>
      </div>
    </div>`;
  };
  el.innerHTML =
    `<div class="overview">共 ${list.length} 条待跟进${urgent.length ? `，其中 ${urgent.length} 条紧急` : ""}</div>` +
    (urgent.length ? `<div class="eyebrow">紧急 · ${urgent.length}</div>` + urgent.map(cardHtml).join("") : "") +
    (normal.length ? `<div class="eyebrow">其他待办 · ${normal.length}</div>` + normal.map(cardHtml).join("") : "");

  if (leadFilter.priority) p.set("priority", leadFilter.priority);
  if (leadFilter.source) p.set("source", leadFilter.source);
  p.set("limit", LEAD_PAGE);
  p.set("offset", offset);
  return "/leads?" + p.toString();
}
/* 来源标识：让律师一眼知道这个客户从哪来、该用什么方式回访 */
function leadSource(gid) {
  if (gid.startsWith("dy:")) return "抖音";
  if (gid.startsWith("kf:")) return "微信客服";
  return "群聊";
}

async function loadLeads(more = false) {
  const el = document.getElementById("leadList");
  if (!loadedOnce.leads && !more) el.innerHTML = skeleton();
  let r;
  try {
    r = await api(leadQuery(more ? leadOffset + LEAD_PAGE : 0));
    // 承办人姓名与改派选单需要名册；律师身份无权也无需
    if (me && me.role === "admin" && !teamCache.length) {
      try { teamCache = await api("/lawyers"); } catch (e) {}
    }
  }
  catch (e) { if (String(e.message) !== "401") el.innerHTML = errCard("loadLeads"); return; }
  loadedOnce.leads = true;
  if (more) {
    leadOffset += LEAD_PAGE;
    leadItems = leadItems.concat(r.items);
  } else {
    leadOffset = 0;
    leadItems = r.items;
  }
  leadTotal = r.total;
  const list = leadItems;
  const hasFilter = leadFilter.q || leadFilter.priority || leadFilter.source;
  document.getElementById("leadCount").textContent =
    leadTotal ? `共 ${leadTotal} 条${list.length < leadTotal ? ` · 已显示 ${list.length}` : ""}` : "";
  document.getElementById("leadMore").hidden = list.length >= leadTotal;
  const sig = leadView + JSON.stringify(list);
  if (lastSig.leads === sig) return;
  lastSig.leads = sig;
  if (!list.length) {
    el.innerHTML = hasFilter
      ? emptyState("search", "没有匹配的线索", "换个关键词，或点掉上面的筛选条件再试")
      : emptyState("flame",
          leadView ? "暂无待跟进线索" : "还没有线索记录",
          "客户在咨询中留下联系方式、或表达面谈意愿时，AI 会自动整理一份交接单放到这里，并推送给接待律师。");
    return;
  }
  el.innerHTML = list.map(l => {
    let facts = [], factors = [];
    try { facts = JSON.parse(l.key_facts || "[]"); } catch (e) {}
    try { factors = JSON.parse(l.factors || "[]"); } catch (e) {}
    const it = INTENT[l.intent] || INTENT.cold;
    const pr = PRIORITY[l.priority];
    // 律师看到的全是自己的单，「X承办」是废话；只有管理员全量视角需要归属
    const who = (me && me.role === "admin" && l.assigned_userid)
      ? lawyerName(l.assigned_userid) : "";
    return `
      <div class="card ${l.priority === "P0" ? "urgent" : ""}">
        <div class="row">
          ${pr ? `<span class="pchip ${pr.cls}">${pr.zh}</span>`
               : `<span class="badge ${it.cls}">${it.zh}</span>`}
          <span class="chip">${leadSource(l.group_id)}</span>
          <span class="chip"><span class="tx">${esc(groupName(l.group_id))}</span></span>
          ${l.case_type ? `<span class="chip">${esc(l.case_type)}</span>` : ""}
          ${l.urgency === "high" ? `<span class="badge warn">${esc(URGENCY[l.urgency])}</span>` : ""}
          ${l.status !== "new" ? `<span class="chip">${esc(LEAD_STATUS[l.status] || l.status)}</span>` : ""}
          ${l.notified_at ? "" : `<span class="badge warn">未推送</span>`}
          ${timeEl(l.updated_at)}
        </div>
        <div class="body-l">${esc(l.summary || "（未归纳）")}</div>
        ${facts.length ? `<div class="meta" style="line-height:1.8">${
          facts.map(f => "· " + esc(f)).join("<br>")}</div>` : ""}
        ${factors.length ? `<div class="meta" style="margin-top:6px">优先依据：${
          factors.map(f => esc(f.label + " +" + f.points)).join(" · ")}</div>` : ""}
        <div class="row" style="margin-top:10px">
          ${l.contact
            ? `<a href="tel:${esc(l.contact)}" class="btn-tonal" style="text-decoration:none">${ico("phone")}${esc(l.contact)}</a>`
            : `<span class="meta">客户未留联系方式</span>`}
          ${who ? `<span class="chip" style="margin-left:auto">${esc(who)}承办</span>` : ""}
          <button class="btn-text muted admin-only" ${who ? "" : 'style="margin-left:auto"'}
            onclick="openAssign(${l.id})">${who ? "改派" : "指派律师"}</button>
        </div>
        ${l.opening_line ? `<div style="margin-top:10px;padding:8px 12px;border-radius:8px;
          background:var(--brand-tint);color:var(--brand);font-size:14px;line-height:1.6">
          开场参考：${esc(l.opening_line)}</div>` : ""}
        ${l.suggested_action ? `<div class="meta" style="margin-top:6px">建议：${esc(l.suggested_action)}</div>` : ""}
        ${l.notes ? `<div style="margin-top:8px;padding:8px 12px;border-radius:8px;
          background:var(--chip-bg);font-size:13px;line-height:1.6;color:var(--ink-1)">
          ${ico("note")}${esc(l.notes)}</div>` : ""}
        <div class="row fb-row">
          <button class="btn-text muted" data-act="convo" data-gid="${esc(l.group_id)}">${ico("message")}对话</button>
          <button class="btn-text muted" onclick="editNotes(${l.id})">${ico("note")}${l.notes ? "改备注" : "记备注"}</button>
          ${l.notified_at ? "" : `<button class="btn-text" onclick="notifyLead(${l.id})">${ico("refresh")}推送</button>`}

      </div>`;
  }).join("");

async function saveNotes(id) {

async function setLead(id, status, silent = false) {
  const prev = (leadItems.find(x => x.id === id) || {}).status || "new";
  try {
    const r = await api(`/leads/${id}/status`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status }),
    });
    if (!silent) {
      let msg = status === "converted" ? "已标记成交 🎉"
        : `已标记为${LEAD_STATUS[status] || status}`;
      if (r && r.todos_closed) msg += `，同时结掉 ${r.todos_closed} 条待办`;
      /* 「无效」与「已联系」紧邻，误触会把活线索打死——给一条可撤销的退路 */
      toast(msg, true, status === "invalid" ? () => setLead(id, prev, true) : null);
    }
    lastSig.leads = null;
    loadLeads(); refreshLeadBadge(); refreshTodoBadge();
  } catch (e) { toast("操作失败，请重试", false); }
}
async function notifyLead(id) {

/* ============ 客资导入 ============ */
async function uploadKezi(input) {
  const file = input.files && input.files[0];
  input.value = "";                       // 允许连续上传同一个文件
  if (!file) return;
  toast("正在导入 " + file.name + "…");
  try {
    /* 原始字节直传（服务端不依赖 multipart）；默认不推送，导入后人工复核 */
    const r = await api("/leads/import?filename=" + encodeURIComponent(file.name), {
      method: "POST", body: file,
    });
    const bits = [`新增 ${r.imported} 条`];
    if (r.updated) bits.push(`更新 ${r.updated} 条`);
    if (r.no_contact) bits.push(`${r.no_contact} 条手机号不可用已跳过`);
    toast(bits.join(" · "));
    lastSig.leads = null;
    loadLeads(); refreshLeadBadge();
    /* 导完就把「下一步」摆到眼前：否则批量分派入口藏在团队 tab 里没人找得到，
       几百条线索就一直躺着没有承办人 */
    if (r.imported && !r.no_contact) {
      try {
        const m = await api("/metrics");
        if (m.leads_unassigned > 0) {
          if (!teamCache.length) { try { teamCache = await api("/lawyers"); } catch (e) {} }
          if (teamCache.some(l => l.active && l.on_duty)) { askBulkAssign(); return; }
          openSheet(`<h2>导入完成，还差一步</h2>
            <p style="font-size:15px;margin:12px 0">这批线索有 ${m.leads_unassigned} 条还没有承办律师。
            先到「团队」里添加律师，之后一键分派即可。</p>
            <button class="btn-primary xl" onclick="forceCloseSheet();setTab('team')">去添加律师</button>`);
          return;
        }
      } catch (e) { /* 引导失败不影响导入结果 */ }
    }
    if (r.no_contact) {
      openSheet(`<h2>有 ${r.no_contact} 条没导进来</h2>
        <p style="font-size:15px;margin:12px 0">这些行的手机号是打码的（如 138****5678）或为空，
        打不通就没法跟进，所以没有放进队列。</p>
        <p class="meta">请到抖音来客「线索经营 → 客资中心」里查看这几条的完整号码，
        或确认导出时是否勾选了完整手机号。</p>`);
    }
  } catch (e) {
    toast(e.detail || "导入失败，请重试", false);
  }
}

    try { await navigator.clipboard.writeText(url); copied = true; } catch (e) {}
    if (copied) toast("登录链接已复制（旧链接已失效），请私发给本人");
    else openSheet(`<h2>登录链接</h2>
      <p class="meta" style="margin:8px 0">请完整复制后私发给本人（旧链接已失效）：</p>
      <textarea readonly style="width:100%;min-height:90px" onclick="this.select()">${esc(url)}</textarea>`);
    loadedOnce.team = false; loadTeam();
  } catch (e) { toast("生成失败，请重试", false); }
}

/* ============ 记录 ============ */
function setLogView(v) {
  logView = v;
  document.getElementById("segReplies").classList.toggle("on", v === "replies");
  document.getElementById("segDecisions").classList.toggle("on", v === "decisions");
  loadedOnce.log = false;
  lastSig.log = null;
  loadLog();
}
function withDayGroups(list, render) {
  let out = "", lastDay = "";
  for (const item of list) {
    const d = dayLabel(item.created_at);
    if (d !== lastDay) { out += `<div class="eyebrow">${d}</div>`; lastDay = d; }
    out += render(item);
  }
  return out;
}
async function loadLog() {
  const el = document.getElementById("logList");
  const seq = ++logReq; // 分段快速切换/轮询重叠时，过期响应直接丢弃
  if (!loadedOnce.log) el.innerHTML = skeleton();
  try {
    if (logView === "replies") {
      const list = await api("/replies?limit=100");
      if (seq !== logReq) return;
      loadedOnce.log = true;
      for (const r of list) repliesFb[r.id] = r.feedback || "";
      const sig = "r" + JSON.stringify(list);
      if (lastSig.log === sig) return;
      lastSig.log = sig;
      if (!list.length) {
        const shadow = !healthCache || healthCache.mode !== "live";
        el.innerHTML = emptyState("message", "还没有 AI 回复记录", shadow
          ? "当前为影子模式，AI 起草的回复会先显示在这里，供您查看和反馈，不会发进客户群。"
          : "AI 在客户群发言后，每一条都会在这里留痕。");
        return;
      }
      el.innerHTML = withDayGroups(list, r => {
        const fb = !r.feedback ? `
            <button class="btn-text" style="margin-left:auto" onclick="feedbackGood(${r.id})">${ico("thumb")}有帮助</button>
            <button class="btn-text" onclick="openFeedback(${r.id})">${ico("edit")}需修正</button>`
          : r.feedback === "good"
            ? `<button class="badge ok" style="margin-left:auto" onclick="openFeedback(${r.id})">${ico("check")}已标记：有帮助</button>`
            : `<button class="badge warn" style="margin-left:auto" onclick="openFeedback(${r.id})">${ico("edit")}已标记需修正</button>`;
        const note = r.feedback && r.feedback.startsWith("needs_fix:") && r.feedback.slice(10)
          ? `<div class="fb-note">备注：${esc(r.feedback.slice(10))}</div>` : "";
        const isOpen = expanded.has("r" + r.id);
        /* 客户原话在上、AI 回复在下：复核一句话是否得当，得先看见它在回什么 */
        return `
          <div class="card">
            <div class="row">
              ${r.mode === "live" ? `<span class="badge ok">已发出</span>`
                                  : `<span class="badge brand">草稿</span>`}
              <span class="chip">${zh(ZH.category, r.category)}</span>
              ${r.compliance_passed ? "" : `<button class="badge warn" onclick="toggleNote(${r.id})">${ico("shield")}已替换</button>`}
              <span class="chip"><span class="tx">${esc(groupName(r.group_id))}</span></span>
              ${timeEl(r.created_at)}
            </div>
            <div class="fb-note" id="cmp-${r.id}" hidden>该回复触碰合规红线，已自动替换为安全话术——这是系统在保护所里，不是故障。</div>
            ${r.question ? `<div class="meta" style="margin-top:8px">客户：${esc(r.question)}</div>` : ""}
            <div class="quote ${isOpen ? "" : "clamp"}" id="q-${r.id}">${esc(r.text)}</div>
            <button class="btn-text muted" id="qx-${r.id}" style="display:none;min-height:40px"
                    onclick="toggleQuote(${r.id})">${isOpen ? "收起" : "展开"}</button>
            <div class="row fb-row">
              <button class="btn-text muted" data-act="convo" data-gid="${esc(r.group_id)}">${ico("message")}查看对话</button>
              ${fb}
            </div>
            ${note}
          </div>`;
      });
      requestAnimationFrame(() => {
        for (const r of list) {
          const q = document.getElementById("q-" + r.id), x = document.getElementById("qx-" + r.id);
          if (q && x && (q.scrollHeight - q.clientHeight > 4 || expanded.has("r" + r.id)))
            x.style.display = "inline-flex";
        }
      });
    } else {
      const list = await api("/decisions?limit=150");
      if (seq !== logReq) return;
      loadedOnce.log = true;
      const sig = "d" + JSON.stringify(list);
      if (lastSig.log === sig) return;
      lastSig.log = sig;
      if (!list.length) {
        el.innerHTML = emptyState("message", "还没有判断记录",
          "AI 对每条客户消息的处理判断（包括保持沉默）都会记录在这里，便于随时复查。");
        return;
      }
      /* should_speak 是「判定应发言」：影子模式下措辞不得暗示已发出 */
      const live = healthCache && healthCache.mode === "live";
      el.innerHTML = withDayGroups(list, d => {
        let reasons = [];
        try { reasons = JSON.parse(d.reasons); } catch (e) {}
        const act = d.action === "answer"
          ? `<span class="badge brand">${ico("message")}直接回答</span>`
          : d.action === "handoff"
            ? `<span class="badge warn">${ico("handoff")}安抚承接</span>`
            : `<span class="chip">${ico("silence")}${zh(ZH.action, d.action)}</span>`;
        const spoke = !d.should_speak ? ""
          : live ? `<span class="badge ok">已发言</span>`
                 : `<span class="badge brand">已起草（演练）</span>`;
        return `
          <div class="card" style="padding:10px 14px">
            <div class="row">
              ${act}
              <span class="chip">${zh(ZH.category, d.category)}</span>
              ${d.urgent ? `<span class="badge bad"><span class="dot" style="background:var(--bad)"></span>紧急</span>` : ""}
              ${spoke}
              <span class="chip"><span class="tx">${esc(groupName(d.group_id))}</span></span>
              ${timeEl(d.created_at)}
            </div>
            <div class="meta" style="margin-top:6px">${esc(reasons.join(" · "))}</div>
          </div>`;
      });
    }
  } catch (e) { if (String(e.message) !== "401") el.innerHTML = errCard("loadLog"); }
}
function toggleQuote(id) {
  const q = document.getElementById("q-" + id), x = document.getElementById("qx-" + id);
  const key = "r" + id;
  if (expanded.has(key)) { expanded.delete(key); q.classList.add("clamp"); x.textContent = "展开"; }
  else { expanded.add(key); q.classList.remove("clamp"); x.textContent = "收起"; }
}
function toggleNote(id) {
  const n = document.getElementById("cmp-" + id);
  if (n) n.hidden = !n.hidden;
}
async function setFeedback(id, val) {
  await api(`/replies/${id}/feedback`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ feedback: val }),
  });
  repliesFb[id] = val;
  lastSig.log = null;
}
/* 「有帮助」也可撤销：误触不污染话术迭代库 */
async function feedbackGood(id) {
  try {
    await setFeedback(id, "good");
    toast("已记录，感谢反馈", true, async () => { await setFeedback(id, ""); loadLog(); });
    loadLog();
  } catch (e) { toast("操作失败，请重试", false); }
}
let fbChoice = "";
const FB_OPTS = ["内容不准确", "语气不合适", "不该由 AI 回复", "话术太长"];
function openFeedback(id) {
  /* 重开时回填已有反馈，且可改标回「有帮助」或清除标记 */
  const cur = repliesFb[id] || "";
  let note = "";
  fbChoice = "";
  if (cur.startsWith("needs_fix:")) {
    const body = cur.slice(10);
    const hit = FB_OPTS.find(o => body === o || body.startsWith(o + "："));
    if (hit) { fbChoice = hit; note = body === hit ? "" : body.slice(hit.length + 1); }
    else note = body;
  }
  openSheet(`
    <h2>哪里需要修正？</h2>
    <div class="sub">您的反馈会进入话术迭代库，帮助 AI 下次说得更好</div>
    <div class="fb-opts">${FB_OPTS.map(o =>
      `<button onclick="pickFb(this,'${o}')" class="${o === fbChoice ? "on" : ""}">${o}</button>`).join("")}</div>
    <div class="field">
      <label for="fbNote">补充说明（选填）</label>
      <textarea id="fbNote" placeholder="例如：应该先安抚客户情绪" oninput="fbValidate()">${esc(note)}</textarea>
    </div>
    <button class="btn-primary xl" id="fbSubmit" disabled onclick="submitFb(${id})">提交反馈</button>
    ${cur ? `<button class="btn-text" style="width:100%;justify-content:center;margin-top:6px"
        onclick="relabel(${id}, 'good')">改标为：有帮助</button>
      <button class="btn-text muted" style="width:100%;justify-content:center"
        onclick="relabel(${id}, '')">清除反馈标记</button>` : ""}
  `);
  fbValidate();
}
async function relabel(id, val) {
  try {
    await setFeedback(id, val);
    forceCloseSheet();
    toast(val ? "已改标为「有帮助」" : "已清除反馈标记");
    loadLog();
  } catch (e) { toast("操作失败，请重试", false); }
}
function pickFb(btn, val) {
  fbChoice = fbChoice === val ? "" : val;
  document.querySelectorAll(".fb-opts button").forEach(b =>
    b.classList.toggle("on", b.textContent === fbChoice));
  fbValidate();
}
function fbValidate() {
  const note = (document.getElementById("fbNote") || {}).value || "";
  document.getElementById("fbSubmit").disabled = !fbChoice && !note.trim();
}
async function submitFb(id) {
  const note = (document.getElementById("fbNote") || {}).value || "";
  const text = [fbChoice, note.trim()].filter(Boolean).join("：");
  const btn = document.getElementById("fbSubmit");
  btn.disabled = true; btn.textContent = "提交中…";
  try {
    await setFeedback(id, "needs_fix:" + text);
    forceCloseSheet(); toast("已记录，感谢反馈"); loadLog();
  } catch (e) {
    btn.disabled = false; btn.textContent = "提交反馈";
    toast("操作失败，请重试", false);
  }
}

  lastSig.board = sig;
  const st = m.leads_by_status || {};

      <div><div class="n" style="color:var(--warn)">${m.feedback_needs_fix}</div><div class="l">需修正</div></div>
    </div><div class="l" style="margin-top:4px">话术反馈</div></div>`;
  /* 线索漏斗：合伙人真正关心的是「进来多少 → 联系了多少 → 成交多少」 */
  const funnel = [
    ["线索总数", m.leads_total || 0, "var(--ink-1)"],
    ["待跟进", st.new || 0, "var(--bad)"],
    ["已联系", st.contacted || 0, "var(--warn)"],
    ["已成交", st.converted || 0, "var(--ok)"],
  ];
  const fEl = document.getElementById("funnel");
  if (fEl) {
    const conv = m.leads_total ? Math.round((st.converted || 0) / m.leads_total * 100) : 0;
    fEl.innerHTML = funnel.map(([label, n, c]) =>
      `<div style="flex:1;text-align:center">
         <div style="font-size:22px;font-weight:700;color:${c}">${n}</div>
         <div class="l">${label}</div>
       </div>`).join("") +
      `<div style="flex:1;text-align:center">
         <div style="font-size:22px;font-weight:700;color:var(--brand)">${conv}%</div>
         <div class="l">成交率</div>
       </div>`;
    const bs = m.leads_by_source || {};
    const srcEl = document.getElementById("funnelSrc");
    if (srcEl) {
      const bits = [["抖音", bs.dy], ["微信客服", bs.kf], ["群聊", bs.group]]
        .filter(([, n]) => n > 0).map(([z, n]) => `${z} ${n}`);
      srcEl.textContent = bits.length > 1 ? "来源：" + bits.join(" · ") : "";
    }
  }
  /* 分律师负载（管理员）：谁手上压着 P0、派单是否均衡，一眼可见 */
  const lbCard = document.getElementById("lawyerBoardCard");
  if (m.by_lawyer && m.by_lawyer.length) {
    lbCard.hidden = false;
    document.getElementById("lawyerBoard").innerHTML =
      m.by_lawyer.map(l => `
        <div class="row" style="padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:nowrap">
          <span style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;${l.active ? "" : "opacity:.5"}">${esc(l.name)}</span>
          ${l.on_duty ? "" : `<span class="chip">停接新单</span>`}
          <span class="meta" style="margin-left:auto">在办 ${l.open}</span>
          ${l.p0 ? `<span class="pchip p0" style="margin-left:8px">P0×${l.p0}</span>` : ""}
        </div>`).join("") +
      (m.leads_unassigned
        ? `<div class="meta" style="margin-top:8px;color:var(--warn)">另有 ${m.leads_unassigned} 条线索未指派（名册启用前的旧单）</div>`
        : "");
  } else if (lbCard) lbCard.hidden = true;
  const order = [["answer", "--s1"], ["handoff", "--s2"], ["silence", "--s3"]];
  const total = order.reduce((s, [k]) => s + (m.by_action[k] || 0), 0);
  document.getElementById("dist").innerHTML = total === 0
    ? `<div style="flex:1;background:var(--line)"></div>`
    : order.map(([k, c]) =>
        `<div style="flex:${m.by_action[k] || 0};background:var(${c})"></div>`).join("");
  document.getElementById("distLegend").innerHTML = total === 0
    ? `<span class="meta">暂无判断数据</span>`
    : order.map(([k, c]) => {
        const n = m.by_action[k] || 0;
        return `<span><i style="background:var(${c})"></i>${ZH.action[k]} ${n} · ${Math.round(n / total * 100)}%</span>`;
      }).join("");
}

const groupFilter = { q: "", source: "" };
let groupShown = 0;
const GROUP_PAGE = 40;
let groupSearchTimer = null;
function debouncedGroupSearch() {
  clearTimeout(groupSearchTimer);

    groupFilter.q = document.getElementById("groupQ").value.trim().toLowerCase();

  }, 250);
}
function toggleGroupFilter(btn) {

function groupSourceOf(g) {
  if (g.group_id.startsWith("dy:")) return "dy";

  return "group";

    if (groupFilter.q) {
      const hay = `${g.name} ${g.lawyer_name} ${g.case_type} ${g.group_id}`.toLowerCase();
      if (!hay.includes(groupFilter.q)) return false;

    return true;
  });

  }).join("");

  if (input) toggleAi(input.dataset.gid, input);
});

/* ============ 全站事件委托 ============
   动态值（group_id / userid）一律走 data-* 属性，不拼进内联 onclick 的 JS 字符串：
   esc() 做的是 HTML 实体转义，而事件属性里浏览器会先把实体解码再当 JS 执行，
   一个带引号的群名就能越出字符串——这是存储型 XSS 的入口。 */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const { act, gid, uid, lead } = el.dataset;
  if (act === "convo") openConversation(gid);
  else if (act === "assign") doAssign(Number(lead), uid);
  else if (act === "sendlogin") sendLogin(uid);
  else if (act === "copylogin") copyLogin(uid);
  else if (act === "editlawyer") editLawyer(uid);
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-act='duty']");
  if (el) toggleDuty(el.dataset.uid, el);
});
let pendingEnableGid = null;
async function toggleAi(gid, input) {
  const on = input.checked;
  /* 从严处理：健康状态未知时按正式模式对待（对外发言不可逆） */
  if (on && (!healthCache || healthCache.mode === "live")) {
    input.checked = false; // 待确认
    pendingEnableGid = gid;
    openSheet(`
      <h2>在正式模式下开启该群 AI？</h2>
      <p style="font-size:15px;margin:12px 0 20px">开启后，AI 的回复将直接发送到该客户群，客户会立即看到。</p>
      <button class="btn-primary xl" onclick="confirmEnable()">确认开启</button>
      <button class="btn-text muted" style="width:100%;justify-content:center;margin-top:6px" onclick="closeSheet()">暂不开启</button>
    `);
    return;
  }
  await postAiSwitch(gid, on, input);
}
async function confirmEnable() {
  const gid = pendingEnableGid;
  pendingEnableGid = null;
  forceCloseSheet();
  if (gid) await postAiSwitch(gid, true, null);
}
async function postAiSwitch(gid, on, input) {
  try {
    await api(`/groups/${encodeURIComponent(gid)}/ai`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ enabled: on }),
    });
    toast(on ? "已开启本群 AI" : "已暂停本群 AI，将不再自动回复");
    lastSig.groups = null;
    loadGroups();
  } catch (e) {
    if (input) input.checked = !on;
    toast("设置失败，请重试", false);
  }
}
function editGroup(gid) {
  /* 新档案 AI 默认关闭：正式模式下的开启必须走确认闸门（引导卡第 3 步即开 AI） */
  const g = groupsCache.find(x => x.group_id === gid) || {
    group_id: "", name: "", client_status: "prospect", case_type: "", case_stage: "",
    lawyer_name: "", lawyer_userid: "", backup_userid: "", ai_enabled: false, robot_webhook: "",
  };
  const isNew = !gid;
  openSheet(`
    <h2>${isNew ? "新增群档案" : "编辑：" + esc(g.name || g.group_id)}</h2>
    <div class="eyebrow">基础信息</div>
    <div class="field" id="fw_gid">
      <label>群 ID ${isNew ? '<span class="req">*</span>' : ""}</label>
      <input id="f_gid" value="${esc(g.group_id)}" ${isNew ? "" : "readonly"}>
      <div class="help">企业微信群的 ChatId，创建后不可修改；填错时可在本页底部删除档案后重建</div>
    </div>
    <div class="field"><label>群名称</label>
      <input id="f_name" value="${esc(g.name)}" placeholder="例如：张女士劳动仲裁服务群"></div>
    <div class="field"><label>客户状态</label>
      <select id="f_status">
        <option value="prospect" ${g.client_status === "prospect" ? "selected" : ""}>咨询中（未成交）</option>
        <option value="signed" ${g.client_status === "signed" ? "selected" : ""}>已成交</option>
      </select></div>
    <div class="eyebrow">案件信息</div>
    <div class="field"><label>案件类型</label>
      <input id="f_case" value="${esc(g.case_type)}" placeholder="例如：劳动仲裁"></div>
    <div class="field"><label>案件阶段</label>
      <input id="f_stage" value="${esc(g.case_stage)}">
      <div class="help">可留空，例如：已提交仲裁申请</div></div>
    <div class="eyebrow">责任人与机器人</div>
    <div class="field"><label>承办律师姓氏</label>
      <input id="f_lawyer" value="${esc(g.lawyer_name)}">
      <div class="help">仅填姓氏，用于群内称呼。例如填「魏」，客户会看到「魏律师」</div></div>
    <div class="field"><label>律师企微账号</label>
      <input id="f_luid" value="${esc(g.lawyer_userid)}">
      <div class="help">用于向律师推送提醒</div></div>
    <div class="field"><label>第二责任人企微账号</label>
      <input id="f_buid" value="${esc(g.backup_userid)}">
      <div class="help">律师超时未处理时升级提醒此人，可留空</div></div>
    <div class="field" id="fw_hook"><label>群机器人 Webhook</label>
      <input id="f_hook" value="${esc(g.robot_webhook)}">
      <div class="help">在企业微信群 → 群机器人 → Webhook 地址中复制，粘贴完整地址或 key 均可。如群里收不到消息，请回来核对此处地址</div></div>
    <button class="btn-primary xl" id="gSave" onclick="saveGroup(${isNew}, ${JSON.stringify(!!g.ai_enabled)})">保存群档案</button>
    <button class="btn-text muted" style="width:100%;justify-content:center;margin-top:6px" onclick="closeSheet()">取消</button>
    ${isNew ? "" : `<button class="btn-text btn-danger" style="width:100%;justify-content:center;margin-top:14px"
      onclick="askDeleteGroup()">删除群档案</button>`}
  `, true);
}
let pendingDeleteGid = null;
function askDeleteGroup() {
  /* 内嵌确认条而不是覆写整个弹层：覆写会把用户刚填了一半的档案无声丢掉，
     「取消」也回不去。照 discardBar 的模式在表单底部就地确认。 */
  if (document.getElementById("delBar")) return;
  pendingDeleteGid = document.getElementById("f_gid").value.trim();
  const bar = document.createElement("div");
  bar.id = "delBar";
  bar.style.cssText = "margin-top:14px;padding:12px 14px;border-radius:10px;" +
    "background:var(--bad-bg,#FBEAEA)";
  bar.innerHTML = `<div style="font-size:14px;color:var(--bad);line-height:1.6">
      删除后 AI 不再关注该会话；历史消息与记录保留。此操作不可恢复。</div>
    <div class="row" style="margin-top:10px">
      <button class="btn-text muted" style="min-height:36px"
        onclick="document.getElementById('delBar').remove()">取消</button>
      <button class="btn-text" style="margin-left:auto;min-height:36px;color:var(--bad)"
        onclick="confirmDeleteGroup()">确认删除</button>
    </div>`;
  document.getElementById("sheetBody").appendChild(bar);
  bar.scrollIntoView({ block: "nearest" });
}
async function confirmDeleteGroup() {
  const gid = pendingDeleteGid;
  pendingDeleteGid = null;
  sheetDirty = false;
  try {
    await api(`/groups/${encodeURIComponent(gid)}`, { method: "DELETE" });
    forceCloseSheet();
    toast("群档案已删除");
    lastSig.groups = null;
    loadGroups();
  } catch (e) { toast("操作失败，请重试", false); }
}
async function saveGroup(isNew, aiEnabled) {
  const gid = document.getElementById("f_gid").value.trim();
  const wrap = document.getElementById("fw_gid");
  if (!gid) {
    wrap.classList.add("error");
    wrap.querySelector(".help").textContent = "请填写群 ID";
    wrap.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  /* Webhook 最低限度形态校验：拦下粘错内容导致的「显示已配置、实际发不出」 */
  const hook = document.getElementById("f_hook").value.trim();
  const hookWrap = document.getElementById("fw_hook");
  const hookOk = !hook
    || /^https:\/\/qyapi\.weixin\.qq\.com\/cgi-bin\/webhook\/send\?key=[\w-]+$/.test(hook)
    || /^[A-Za-z0-9-]{16,64}$/.test(hook);
  if (!hookOk) {
    hookWrap.classList.add("error");
    hookWrap.querySelector(".help").textContent =
      "地址格式看起来不对：请粘贴完整的 Webhook 地址，或只粘贴其中 key= 后面的部分";
    hookWrap.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  const btn = document.getElementById("gSave");
  btn.disabled = true; btn.textContent = "保存中…";
  const profile = {
    group_id: gid,
    name: document.getElementById("f_name").value.trim(),
    client_status: document.getElementById("f_status").value,
    case_type: document.getElementById("f_case").value.trim(),
    case_stage: document.getElementById("f_stage").value.trim(),
    lawyer_name: document.getElementById("f_lawyer").value.trim(),
    lawyer_userid: document.getElementById("f_luid").value.trim(),
    backup_userid: document.getElementById("f_buid").value.trim(),
    ai_enabled: aiEnabled,
    robot_webhook: document.getElementById("f_hook").value.trim(),
  };
  try {
    await api(`/groups/${encodeURIComponent(gid)}`, {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(profile),
    });
    forceCloseSheet(); toast("群档案已保存");
    lastSig.groups = null;
    loadGroups();
  } catch (e) {
    btn.disabled = false; btn.textContent = "保存群档案";
    toast("操作失败，请重试", false);
  }
}

/* ============ 框架 ============ */
function setTab(t) {
  tab = t;
  for (const k of ["todo", "leads", "log", "board", "groups", "team"]) {
    document.getElementById("tab-" + k).hidden = k !== t;
    document.getElementById("nav-" + k).classList.toggle("on", k === t);
  }
  refresh();
}
async function refresh() {
  loadHealth();
  try {
    if (!groupsCache.length) {
      try { groupsCache = await api("/groups"); } catch (e) { /* 各板块自行处理 */ }
    }
    if (tab === "todo") await loadTodo();
    else refreshTodoBadge(); // 角标跨页告警，不在待办页也保持新鲜
    // 定时刷新不重置翻页：律师翻到第 3 页正在看，60 秒后被拽回第一页
    // 且滚动位置丢失，是纯粹的骚扰。已翻页时只刷角标。
    if (tab === "leads" && leadOffset === 0) await loadLeads();
    else refreshLeadBadge();
    if (tab === "log") await loadLog();
    if (tab === "board") await loadBoard();
    if (tab === "groups") await loadGroups();
    if (tab === "team") { await loadTeam(); refreshBulkAssign(); }
  } catch (e) { /* 401 已弹登录层 */ }
}
setInterval(() => {
  // 弹层打开时跳过本轮：不打断正在填写/阅读的用户
  if (document.getElementById("login").hidden && !sheetOpen()) refresh();
}, 60000);
(async () => {
  if (!token) { showLogin(""); return; }
  try {
    await whoami();
    refresh();
    if (!lsGet("help_seen")) {
      lsSet("help_seen", "1");
      setTimeout(openStatusPanel, 400);
    }
  } catch (e) { /* 401 已弹登录层；网络错误走离线横幅 */ refresh(); }
})();
</script>
