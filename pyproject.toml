[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "angelic-pilot"
version = "0.1.0"
description = "Local pilot for deterministic private equity databook P&L automation."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1.0",
  "google-genai>=1.31,<2.0",
  "openpyxl>=3.1,<4.0",
  "pandas>=2.2,<3.0",
  "pypdf>=5.0,<6.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "python-docx>=1.1,<2.0",
  "python-dotenv>=1.0,<2.0",
  "typer>=0.12,<1.0",
  "uvicorn>=0.30,<1.0",
  "xlrd>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
angelic-pilot = "app.cli:cli"
angelic-api = "app.main:serve"

[tool.setuptools]
packages = [
  "app",
  "app.canonical",
  "app.export",
  "app.extract",
  "app.ingest",
  "app.map",
  "app.models",
  "app.normalize",
  "app.services",
  "app.validate",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
